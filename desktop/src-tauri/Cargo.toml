[package]
name = "vokia"
version = "0.21.0"
edition = "2021"
default-run = "vokia"
# tests/ guarda módulos de teste incluídos por #[path] nos fontes, não crates de integração.
autotests = false

[[bin]]
name = "vokia"
path = "src/main.rs"

[[bin]]
name = "vokia-cli"
path = "src/bin/vokia_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync"] }
shlex = "2"
which = "8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
axum = "0.8.9"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = 0
strip = "symbols"
