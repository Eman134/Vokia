[package]
name = "vokia"
version = "0.1.1"
edition = "2026"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process"] }
which = "8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
