[package]
name = "vokia"
version = "0.3.0"
edition = "2021"
# tests/ guarda módulos de teste incluídos por #[path] nos fontes, não crates de integração.
autotests = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "net", "time", "sync"] }
which = "8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
